<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Checkout — Haven's Artistry</title>
	<link rel="stylesheet" href="styles.css">
	<style>
		.page-head {
			position: relative;
			text-align: center;
			padding: clamp(44px, 6vw, 72px) 0 6px;
			overflow: hidden;
		}

		.checkout {
			display: grid;
			grid-template-columns: 1.3fr 1fr;
			gap: 36px;
			align-items: start;
		}

		.pay-block {
			margin-bottom: 22px;
		}

		.pay-block h3 {
			display: flex;
			align-items: center;
			gap: 10px;
			margin-bottom: 14px;
		}

		.card-fields {
			display: grid;
			gap: 14px;
		}

		.card-fields .row2 {
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 14px;
		}

		.fake-input {
			padding: .85em 1.1em;
			border-radius: 14px;
			border: 1.5px solid var(--line);
			background: rgba(255, 255, 255, .6);
			color: var(--ink-faint);
			font-family: var(--body);
			font-size: .95rem;
		}

		.divider-or {
			display: flex;
			align-items: center;
			gap: 14px;
			margin: 24px 0;
			color: var(--ink-faint);
			font-family: var(--body);
			font-weight: 700;
			letter-spacing: .1em;
			font-size: .82rem;
			text-transform: uppercase;
		}

		.divider-or::before,
		.divider-or::after {
			content: "";
			flex: 1;
			height: 1px;
			background: var(--line);
		}

		.wallet-btn {
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 10px;
			width: 100%;
			padding: 1em;
			border-radius: 16px;
			border: 1.5px solid var(--line);
			background: rgba(255, 255, 255, .7);
			font-family: var(--body);
			font-weight: 800;
			color: var(--ink);
			margin-bottom: 12px;
			transition: .3s;
		}

		.wallet-btn:hover {
			transform: translateY(-2px);
			box-shadow: var(--shadow-card);
			border-color: var(--mauve);
		}

		.wallet-btn .dot {
			width: 11px;
			height: 11px;
			border-radius: 50%;
		}

		.summary .ph {
			aspect-ratio: 1/1;
			width: 54px;
			height: 54px;
			border-radius: 12px;
			flex: 0 0 auto;
		}

		.line-item {
			display: flex;
			align-items: center;
			gap: 14px;
			padding: 14px 0;
			border-bottom: 1px solid var(--line-soft);
		}

		.line-item .nm {
			font-family: var(--heading);
			font-size: 1.15rem;
			font-weight: 600;
		}

		.line-item .pr {
			margin-left: auto;
			font-family: var(--heading);
			font-weight: 600;
			color: var(--mauve);
			font-size: 1.1rem;
		}

		.totals {
			margin-top: 16px;
			font-size: .96rem;
			color: var(--ink-soft);
		}

		.totals .row {
			display: flex;
			justify-content: space-between;
			padding: 6px 0;
		}

		.totals .grand {
			font-family: var(--heading);
			font-size: 1.5rem;
			font-weight: 700;
			color: var(--ink);
			border-top: 1.5px solid var(--line);
			margin-top: 8px;
			padding-top: 14px;
		}

		.empty-cart {
			text-align: center;
			color: var(--ink-soft);
			padding: 30px 0;
		}

		.secure-note {
			display: flex;
			align-items: center;
			gap: 8px;
			justify-content: center;
			color: var(--ink-faint);
			font-size: .82rem;
			margin-top: 16px;
		}

		@media(max-width:860px) {
			.checkout {
				grid-template-columns: 1fr;
			}

			.summary {
				order: -1;
			}
		}
	</style>
</head>

<body data-page="">
	<div id="site-header"></div>

	<section class="page-head">
		<span class="blob" style="width:300px;height:300px;background:var(--mint);top:-80px;left:8%"></span>
		<span class="blob" style="width:280px;height:280px;background:var(--pink);top:-40px;right:8%"></span>
		<div class="wrap" style="position:relative;z-index:2;">
			<span class="eyebrow">Almost Yours</span>
			<h1 class="display" style="font-size:clamp(2.4rem,5.5vw,3.8rem);">Checkout</h1>
			<p class="lead center" style="margin:.5em auto 0;">A few last petals to tuck in, and your little treasures
				are on their way.</p>
		</div>
		<div data-divider></div>
	</section>

	<section class="section" style="padding-top:0">
		<div class="wrap">
			<div class="checkout">
				<!-- ============ PAYMENT ============ -->
				<div class="panel reveal" data-flourish>
					<!-- ===== Pay with Card (Stripe) ===== -->
					<div class="pay-block">
						<h3><span class="dot"
								style="width:12px;height:12px;border-radius:50%;background:#635bff;display:inline-block"></span>Pay
							with Card</h3>
						<!-- ====================================================================
               Stripe integration goes here
               Mount Stripe Elements (Card Element) into #stripe-card-element and
               confirm the PaymentIntent on submit. The fields below are visual
               placeholders only — no real card data is collected.
               ==================================================================== -->
						<div id="stripe-card-element" class="card-fields">
							<div class="field" style="margin:0">
								<label>Card Number</label>
								<div class="fake-input">•••• •••• •••• ••••</div>
							</div>
							<div class="row2">
								<div class="field" style="margin:0"><label>Expiry</label>
									<div class="fake-input">MM / YY</div>
								</div>
								<div class="field" style="margin:0"><label>CVC</label>
									<div class="fake-input">•••</div>
								</div>
							</div>
							<div class="field" style="margin:0"><label>Name on Card</label>
								<div class="fake-input">Full name</div>
							</div>
						</div>
						<button class="btn btn-primary btn-lg btn-block" style="margin-top:16px"
							onclick="alert('Placeholder — Stripe checkout will be wired up here. 🌸')">Pay with
							Card</button>
					</div>

					<div class="divider-or">or</div>

					<!-- ===== Pay with PayPal or Venmo ===== -->
					<div class="pay-block">
						<!-- ====================================================================
               PayPal / Venmo SDK integration goes here
               Render the PayPal Buttons SDK (with Venmo funding source enabled)
               into the containers below. These buttons are visual placeholders.
               ==================================================================== -->
						<button class="wallet-btn" id="paypal-button-container"
							onclick="alert('Placeholder — PayPal SDK will be wired up here.')">
							<span class="dot" style="background:#0070ba"></span>Pay with PayPal
						</button>
						<button class="wallet-btn" id="venmo-button-container"
							onclick="alert('Placeholder — Venmo SDK will be wired up here.')">
							<span class="dot" style="background:#3d95ce"></span>Pay with Venmo
						</button>
					</div>

					<p class="secure-note">🔒 This is a design placeholder — no real payment is processed.</p>
				</div>

				<!-- ============ ORDER SUMMARY ============ -->
				<aside class="panel summary reveal d1">
					<h3 style="margin-bottom:6px;">Your Basket</h3>
					<div id="cartItems"></div>
					<div class="totals" id="totals"></div>
					<a href="shop.html" class="btn btn-ghost btn-block" style="margin-top:18px;">Keep gathering 🌿</a>
				</aside>
			</div>
		</div>
	</section>

	<div id="site-footer"></div>
	<script src="site.js" defer></script>
	<script>
		document.addEventListener('DOMContentLoaded', function () {
			var cart = []; try { cart = JSON.parse(localStorage.getItem('ha_cart') || '[]'); } catch (e) { }
			var box = document.getElementById('cartItems'), tot = document.getElementById('totals');
			if (!cart.length) {
				box.innerHTML = '<p class="empty-cart">Your basket is empty.<br>Wander the <a href="shop.html" style="color:var(--mauve);font-weight:700">shop</a> to gather a few treasures. 🌷</p>';
				tot.innerHTML = ''; return;
			}
			var subtotal = 0;
			box.innerHTML = cart.map(function (it) {
				var n = parseFloat(String(it.price).replace(/[^0-9.]/g, '')) || 0; subtotal += n * (it.qty || 1);
				return '<div class="line-item"><div class="ph" data-label=""></div>' +
					'<div><div class="nm">' + it.name + '</div><div style="font-size:.82rem;color:var(--ink-faint)">Qty ' + (it.qty || 1) + '</div></div>' +
					'<div class="pr">' + it.price + '</div></div>';
			}).join('');
			var ship = subtotal > 0 ? '$[X]' : '$0';
			tot.innerHTML = '<div class="row"><span>Subtotal</span><span>$' + subtotal.toFixed(0) + '</span></div>' +
				'<div class="row"><span>Shipping</span><span>' + ship + ' <span style="color:var(--ink-faint)">(placeholder)</span></span></div>' +
				'<div class="row grand"><span>Total</span><span>$' + subtotal.toFixed(0) + '+</span></div>';
		});
	</script>
</body>

</html>
